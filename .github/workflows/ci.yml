name: CI/CD - Atypico Studio (Build & Deploy S3)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-and-build:
    name: Lint, Build y Artefacto (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad de código (Linter)
        run: pnpm run lint

      - name: Compilar aplicación React
        run: pnpm run build

      - name: Almacenar carpeta dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist-atypico-studio
          path: dist/
          retention-days: 7

  deploy-s3:
    name: Desplegar a Amazon S3
    needs: quality-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto de compilación (dist)
        uses: actions/download-artifact@v4
        with:
          name: dist-atypico-studio
          path: dist/

      - name: Autenticar con AWS (Credenciales AWS Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sincronizar archivos compilados con Amazon S3
        run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} --delete
