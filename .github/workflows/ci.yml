name: CI - Atypico Studio Frontend

on:
  push:
  pull_request:

jobs:
  build-and-verify:
    name: Instalar, Lint y Compilar (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar linter (oxlint)
        run: pnpm run lint

      - name: Compilar TypeScript y bundle Vite
        run: pnpm run build
