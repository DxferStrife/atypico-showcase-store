name: CI - Quality Gate (Pull Request)

on:
  pull_request:
    branches:
      - main

jobs:
  quality-and-build:
    name: Lint, Build y Artefacto (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad de código (Linter)
        run: pnpm run lint

      - name: Compilar aplicación React
        run: pnpm run build

      - name: Almacenar carpeta dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist-atypico-studio
          path: dist/
          retention-days: 7
